- id: '1725909799061'
  alias: Elec - Load Balancer
  description: Perform Load Balancing of Car Charger
  triggers:
  - entity_id:
    - sensor.elec_meter_elec_meter_current_l1
    id: currentchange
    trigger: state
  - entity_id:
    - sensor.elec_meter_elec_meter_current_l2
    id: currentchange
    trigger: state
  - entity_id:
    - sensor.elec_meter_elec_meter_current_l3
    id: currentchange
    trigger: state
  conditions:
  - condition: state
    entity_id: sensor.carcharger_status
    state: charging
  - condition: numeric_state
    entity_id: sensor.carcharger_dynamic_circuit_limit
    attribute: state_dynamicCircuitCurrentP1
    above: 6
  - condition: numeric_state
    entity_id: sensor.carcharger_dynamic_circuit_limit
    attribute: state_dynamicCircuitCurrentP2
    above: 6
  - condition: numeric_state
    entity_id: sensor.carcharger_dynamic_circuit_limit
    attribute: state_dynamicCircuitCurrentP3
    above: 6
    enabled: false
  actions:
  - data:
      device_id: 992d6a5815215a0a47b1d2f7238c3f7d
      time_to_live: 1
      current_p1: "{% set charge = 25 - (states('sensor.elec_meter_elec_meter_current_l1')
        | int(25) | round(0,'ceil'))\n                   + (state_attr('sensor.carcharger_dynamic_circuit_limit','state_dynamicCircuitCurrentP1')
        | int(16) | round(0,'ceil')) %}\n{% if charge > 16 %} {{   16   }} {%- else
        -%} {{ charge }} {%- endif %}"
      current_p2: "{% set charge = 25 - (states('sensor.elec_meter_elec_meter_current_l2')
        | int(25) | round(0,'ceil'))\n                   + (state_attr('sensor.carcharger_dynamic_circuit_limit','state_dynamicCircuitCurrentP2')
        | int(16) | round(0,'ceil')) %}\n{% if charge > 16 %} {{   16   }} {%- else
        -%} {{ charge }} {%- endif %}"
      current_p3: "{% set charge = 25 - (states('sensor.elec_meter_elec_meter_current_l3')
        | int(25) | round(0,'ceil'))\n                   + (state_attr('sensor.carcharger_dynamic_circuit_limit','state_dynamicCircuitCurrentP3')
        | int(16) | round(0,'ceil')) %}\n{% if charge > 16 %} {{   16   }} {%- else
        -%} {{ charge }} {%- endif %}"
    action: easee.set_circuit_dynamic_limit
  mode: single
  max_exceeded: silent
- id: '1725909904225'
  alias: Elec - UpdateChargerCost
  description: Updates the SEK/kWh cost for the car charger
  triggers:
  - entity_id:
    - sensor.postmaster_electricity_price
    trigger: state
  conditions: []
  actions:
  - data:
      device_id: 992d6a5815215a0a47b1d2f7238c3f7d
      cost_per_kwh: '{{states(''sensor.postmaster_electricity_price'') }}'
      currency_id: SEK
    action: easee.set_charging_cost
  mode: single
- id: '1725909966021'
  alias: Elec - Electricity Price Consumption Toggle
  description: Toggle's stuff on and off dependent upon current electricity price.
  triggers:
  - value_template: '{{ ( states(''sensor.postmaster_electricity_price'') | float(0)
      <= states(''input_number.electricity_ceiling'') | float(0) ) and states(''sensor.postmaster_electricity_price'')
      !=  ''unavailable''  }}'
    id: cheap
    alias: Becomes cheap
    trigger: template
  - entity_id:
    - sensor.carcharger_status
    from: disconnected
    to:
    id: reconnected
    alias: Reconnected
    trigger: state
  - id: expensive
    value_template: '{{ ( states(''sensor.postmaster_electricity_price'') | float(0)
      > states(''input_number.electricity_ceiling'') | float(0) ) or is_state(''sensor.postmaster_electricity_price'',
      ''unavailable'' ) }}'
    alias: Becomes expensive
    trigger: template
  - trigger: state
    entity_id:
    - sensor.carcharger_status
    to: charging
    id: Charging
    alias: Starts Charging
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: cheap
      - condition: state
        entity_id: binary_sensor.peak_effect_charge
        state:
        - 'off'
      sequence:
      - data: {}
        response_variable: startResponse
        action: script.start_car_charger
    - conditions:
      - condition: trigger
        id: expensive
      sequence:
      - if:
        - condition: state
          entity_id: sensor.carcharger_status
          state: charging
        then:
        - data:
            device_id: 992d6a5815215a0a47b1d2f7238c3f7d
            action_command: stop
          action: easee.action_command
      - alias: Set Current For Charger
        data:
          device_id: 992d6a5815215a0a47b1d2f7238c3f7d
          current_p1: 5
          current_p2: 5
          current_p3: 5
          time_to_live: 0
        action: easee.set_circuit_dynamic_limit
    - conditions:
      - condition: trigger
        id: reconnected
      - condition: template
        value_template: '{{ ( states(''sensor.postmaster_electricity_price'') | float(0)
          <= states(''input_number.electricity_ceiling'') | float(0) ) and states(''sensor.postmaster_electricity_price'')
          !=  ''unavailable''  }}'
        alias: Test if cheap
      - condition: state
        entity_id: binary_sensor.peak_effect_charge
        state:
        - 'off'
      sequence:
      - data: {}
        action: script.start_car_charger
      alias: Reconnected and Cheap
    - conditions:
      - condition: trigger
        id: reconnected
      - condition: template
        value_template: '{{ ( states(''sensor.postmaster_electricity_price'') | float(0)
          > states(''input_number.electricity_ceiling'') | float(0) ) or states(''sensor.postmaster_electricity_price'')
          ==  ''unavailable''  }}'
        alias: Test if expensive
      sequence:
      - action: easee.action_command
        metadata: {}
        data:
          device_id: 992d6a5815215a0a47b1d2f7238c3f7d
          action_command: stop
      alias: Reconnected and Expensive
    - conditions:
      - condition: trigger
        id:
        - Charging
      - condition: template
        value_template: '{{ ( states(''sensor.postmaster_electricity_price'') | float(0)
          > states(''input_number.electricity_ceiling'') | float(0) ) or states(''sensor.postmaster_electricity_price'')
          ==  ''unavailable''  }}'
        alias: Is expensive
      sequence:
      - action: easee.action_command
        data:
          device_id: 992d6a5815215a0a47b1d2f7238c3f7d
          action_command: stop
      - action: easee.set_circuit_dynamic_limit
        data:
          current_p1: 5
          current_p2: 5
          current_p3: 5
          time_to_live: 0
          device_id: 992d6a5815215a0a47b1d2f7238c3f7d
      alias: Charging and expensive
  mode: single
  trace:
    stored_traces: 10
