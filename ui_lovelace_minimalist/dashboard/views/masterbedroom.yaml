title: "Master Bedroom"
path: "masterbedroom"
subview: true
cards:
  # Navigation Stack
  - type: horizontal-stack
    cards:
      - type: "custom:button-card"
        template: chip_back
        variables:
          ulm_chip_back_path: /ui-lovelace-minimalist/home

  - type: "custom:button-card"
    template: card_input_boolean
    entity: input_boolean.wakeup
    variables:
      ulm_card_input_boolean_name: "Alarm Status"
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.wakeup
        state: "on"
    card:
      type: "custom:button-card"
      template:
        - custom_card_card_input_datetime
      entity: input_datetime.wakeup_time
      variables:
        ulm_card_input_datetime_name: "Alarm Time"
  - type: "custom:button-card"
    template: card_media_player
    entity: media_player.master_bedroom
    variables:
      ulm_card_media_player_name: Sonos Bedroom
      ulm_card_media_player_enable_art: true
      ulm_card_media_player_enable_volume: true
      ulm_card_media_player_collapsible: false

  # Lamps
  - type: custom:fold-entity-row
    head:
      type: custom:button-card
      template: card_light
      entity: light.master_bedroom_lamps
      variables:
        ulm_card_light_enable_slider: true
        ulm_card_light_name: "Master Bedroom Lights"
        ulm_card_light_enable_popup: true
        ulm_card_light_enable_color: true
        ulm_card_light_enable_popup_tap: true
    entities:
      - type: custom:button-card
        template: card_light
        entity: light.master_bedroom_emelie_lamp
        variables:
          ulm_card_light_enable_slider: true
          ulm_card_light_name: "Emelie's Bedside Lamp"
          ulm_card_light_enable_popup: true
          ulm_card_light_enable_color: true
      - type: custom:button-card
        template: card_light
        entity: light.master_bedroom_paul_lamp
        variables:
          ulm_card_light_enable_slider: true
          ulm_card_light_name: "Paul's Bedside Lamp"
          ulm_card_light_enable_popup: true
          ulm_card_light_enable_color: true

  - type: "custom:button-card"
    template: card_graph
    entity: sensor.master_bedroom_climate_sensor_temperature
    variables:
      ulm_card_graph_color: "var(--google-blue)"
      ulm_card_graph_name: "Temperature"  
      ulm_card_graph_entity: sensor.master_bedroom_climate_sensor_temperature
      ulm_card_graph_type: fill
      ulm_card_graph_hours: 24
      ulm_card_graph_group_by: interval
      ulm_card_graph_line_width: 5
      
  - type: "custom:button-card"
    template: card_graph
    entity: sensor.master_bedroom_climate_sensor_humidity
    variables:
      ulm_card_graph_color: "var(--google-green)"
      ulm_card_graph_name: "Humidity"  
      ulm_card_graph_entity: sensor.master_bedroom_climate_sensor_humidity
      ulm_card_graph_type: fill
      ulm_card_graph_hours: 24
      ulm_card_graph_group_by: interval
      ulm_card_graph_line_width: 5

  - type: "custom:button-card"
    template: card_thermostat
    entity: climate.master_bedroom_thermostat
    variables:
      ulm_card_thermostat_enable_collapse: true
      ulm_card_thermostat_enable_controls: true
      ulm_card_thermostat_enable_hvac_modes: false
      ulm_card_thermostat_enable_popup: true
      ulm_card_thermostat_name: "Master Bedroom Radiator"