title: "Maintenance"
path: "Maintenance"
subview: true
cards:
  - type: custom:battery-state-card
    secondary_info: "{last_changed}"
    filter:
      include:
        - name: "attributes.device_class"
          value: "battery"
      exclude:
        - name: "entity_id"
          value: "binary_sensor.*"
    sort:
      by: "state"
    collapse: 8
    bulk_rename:
      - from: " Battery"
      - from: " level"
    colors:
      steps:
        - '#ff0000'
        - '#ffff00'
        - '#00ff00'
      gradient: trues