title: "Security"
path: "security"
subview: true
cards:
  - type: "custom:button-card"
    template: chip_back
    variables:
      ulm_chip_back_path: /ui-lovelace-minimalist/home
  - type: horizontal-stack
    cards:   
      - type: 'custom:button-card'
        template: chip_navigate
        label: Hall
        variables:
          ulm_chip_navigate_icon: mdi:cctv
          ulm_chip_navigate_path: "/ui-lovelace-minimalist/camera-hall"
          ulm_chip_navigate_icon_color: "var(--google-blue)"
      - type: 'custom:button-card'
        template: chip_navigate
        label: Decking
        variables:
          ulm_chip_navigate_icon: mdi:cctv
          ulm_chip_navigate_path: "/ui-lovelace-minimalist/camera-decking"
          ulm_chip_navigate_icon_color: "var(--google-yellow)"
      - type: 'custom:button-card'
        template: chip_navigate
        label: Garden
        variables:
          ulm_chip_navigate_icon: mdi:cctv
          ulm_chip_navigate_path: "/ui-lovelace-minimalist/camera-garden"
          ulm_chip_navigate_icon_color: "var(--google-red)"
      - type: 'custom:button-card'
        template: chip_navigate
        label: Laundry
        variables:
          ulm_chip_navigate_icon: mdi:cctv
          ulm_chip_navigate_path: "/ui-lovelace-minimalist/camera-laundry"
          ulm_chip_navigate_icon_color: "var(--google-green)"
# Doors and Windows - Alerts
# Basement
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.garage_door_sensor_contact
        state_not: "off"
    card:
      type: "custom:button-card"
      template: card_binary_sensor_alert
      entity: binary_sensor.garage_door_sensor_contact
